<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darshit Darji</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#fff;--ink:#101416;--mute:#5c656a;--accent:#e0531a;--glass:rgba(255,255,255,.72);--line:rgba(16,20,22,.08);--b2:#5b7cfa;--b3:#1fb59a;--bo:.26}
@media (prefers-color-scheme:dark){:root{--bg:#0e1113;--ink:#eceeee;--mute:#97a1a6;--accent:#ff6a2e;--glass:rgba(16,20,23,.66);--line:rgba(255,255,255,.1);--bo:.2;color-scheme:dark}}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:18px/1.5 Barlow,system-ui,sans-serif;isolation:isolate;padding:0 max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
.amb{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--bo)}
.amb i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:var(--accent)}
.amb i:nth-child(2){width:40vmax;height:40vmax;right:-14vmax;top:22vh;background:var(--b2)}
.amb i:nth-child(3){width:30vmax;height:30vmax;left:30vw;bottom:-16vmax;background:var(--b3)}
.wrap{max-width:760px;margin:0 auto;padding-top:64px}
.sec{font:600 .68rem "Martian Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
h1{font:700 clamp(2.2rem,6vw,3.6rem)/1.05 "Barlow Semi Condensed","Arial Narrow",sans-serif;margin:8px 0 28px}
a.card{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;text-decoration:none;color:inherit;padding:20px 22px;border-radius:22px;margin-bottom:12px;
 background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 14px 40px -24px #0006;transition:transform .15s}
a.card:hover{transform:translateY(-2px)}
a.card b{font:700 1.35rem "Barlow Semi Condensed",sans-serif}
a.card span{color:var(--mute);font-size:.95rem;grid-column:1}
a.card i{grid-row:1/3;grid-column:2;font-style:normal;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700}
a.plain{color:var(--accent);font-weight:600}
footer{margin-top:40px;font:400 .66rem "Martian Mono",monospace;color:var(--mute)}
</style></head>
<body><div class="amb" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="wrap">
<div class="sec">Electrical engineering · IIT Bombay</div>
<h1>Darshit Darji</h1>
<a class="card" href="/guides/"><b>Guides</b><span>Operating procedures for lab instruments</span><i>→</i></a>
</main></body></html>
